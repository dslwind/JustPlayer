name: Android CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleLatestUniversalDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: just-player-debug
          path: app/build/outputs/apk/latestUniversal/debug/*.apk
          retention-days: 30
